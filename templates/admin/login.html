{% extends "base.html" %}
{% block title %}Log in · {{ profile.name }}{% endblock %}
{% block content %}
<div class="wrap">
  <form class="panel login" method="post" action="/admin/login">
    <h2>Admin login</h2>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <div class="field"><label for="u">Username</label><input id="u" type="text" name="username" autocomplete="username" required autofocus></div>
    <div class="field"><label for="p">Password</label><input id="p" type="password" name="password" autocomplete="current-password" required></div>
    <button class="btn primary" type="submit" style="width:100%;justify-content:center;margin-top:8px">Log in</button>
  </form>
</div>
{% endblock %}
